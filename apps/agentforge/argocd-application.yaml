apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentforge
  namespace: argocd
  annotations:
    # server-defaulted fields (StatefulSet, ExternalSecret, HTTPRoute) would
    # otherwise show as permanent drift in a client-side diff
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/subhankar720/helmsman-fleet.git
    targetRevision: main
    path: apps/agentforge
    # apps/agentforge is the AgentForge Helm chart (Chart.yaml); render it
    # with the Helmsman kind-cluster overrides
    helm:
      releaseName: agentforge
      valueFiles:
        - values-helmsman-onprem.yaml
  destination:
    name: helmsman-onprem
    namespace: agentforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Kyverno policies target namespaces with this label
    managedNamespaceMetadata:
      labels:
        helmsman.dev/managed: "true"
