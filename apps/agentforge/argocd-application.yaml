apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentforge
  namespace: argocd
  annotations:
    # server-defaulted fields (StatefulSet, ExternalSecret, HTTPRoute) would
    # otherwise show as permanent drift in a client-side diff
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/subhankar720/helmsman-fleet.git
    targetRevision: main
    path: apps/agentforge
    # apps/agentforge is the AgentForge Helm chart (Chart.yaml); render it
    # with the Helmsman kind-cluster overrides
    helm:
      releaseName: agentforge
      valueFiles:
        - values-helmsman-onprem.yaml
  destination:
    name: helmsman-onprem
    namespace: agentforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # On a fresh pair Argo syncs this app before dev-up has filled secret/agentforge/* in Vault,
    # so the first sync fails on the ExternalSecret. Retry long enough to outlast that (WO-1.5b).
    retry:
      limit: 15
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    # Kyverno policies target namespaces with this label
    managedNamespaceMetadata:
      labels:
        helmsman.dev/managed: "true"
