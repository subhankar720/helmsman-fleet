{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentforge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
    - {{ .Values.httproute.host | quote }}
  rules:
    # Health and metrics bypass auth — probe traffic goes direct to gateway
    # These paths are also configured as --skip-auth-route in oauth2-proxy
    - matches:
        - path:
            type: Exact
            value: /health
        - path:
            type: Exact
            value: /metrics
      # These requests never pass through oauth2-proxy, so nothing else removes
      # client-forged identity headers. Strip them by explicit name (header
      # modifiers take no wildcards). Authorization is left alone on purpose.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Forwarded-User
              - X-Forwarded-Preferred-Username
              - X-Forwarded-Email
              - X-Forwarded-Groups
              - X-Auth-Request-User
              - X-Auth-Request-Email
              - X-Auth-Request-Groups
              - X-Auth-Request-Preferred-Username
              - X-Auth-Request-Access-Token
      backendRefs:
        - name: agentforge-gateway
          namespace: {{ .Release.Namespace }}
          port: 8000

    # All authenticated traffic routes through the Helmsman oauth2-proxy.
    # oauth2-proxy validates the Keycloak JWT, sets X-Forwarded-* identity
    # headers, then proxies to agentforge-gateway.agentforge.svc.cluster.local:8000.
    # A ReferenceGrant in gateway-infra permits this cross-namespace reference.
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.httproute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ .Values.httproute.oauth2Proxy.name }}
          namespace: {{ .Values.httproute.oauth2Proxy.namespace }}
          port: {{ .Values.httproute.oauth2Proxy.port }}
{{- end }}
