{{- if .Values.networkPolicies.enabled }}
# Deny all ingress/egress by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentforge-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Allow traffic within the agentforge namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentforge-allow-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
# agentforge-allow-ingress lives in networkpolicies-narrowed.yaml; agentforge-allow-prometheus was removed.
---
# Allow DNS + outbound to Groq/Confluence/GHCR
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentforge-allow-egress-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:                # DNS
        - port: 53
          protocol: UDP
    - ports:                # HTTPS to Groq, Confluence, GHCR
        - port: 443
          protocol: TCP
    - ports:                # Keycloak NodePort from spoke
        - port: 30081
          protocol: TCP
    - ports:                # Vault NodePort from spoke
        - port: 30082
          protocol: TCP
    - ports:                # Ollama on host.docker.internal
        - port: 11434
          protocol: TCP
{{- end }}
