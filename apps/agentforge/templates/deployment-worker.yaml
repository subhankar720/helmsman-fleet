apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforge-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
  annotations:
    # PWP-1 item 1.2: after the migration (wave 1) has succeeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforge-worker
  template:
    metadata:
      annotations:
        # WO-P1.B sync-wave test (PWP-1 item 1.2): forces a roll so the order can be observed; reverted after.
        helmsman.dev/wo-p1b-wave-test: "wo_p1b_wave_test column"
      labels:
        {{- include "agentforge.labels" . | nindent 8 }}
        app.kubernetes.io/name: agentforge-worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- include "agentforge.podSecurityContext" . | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: worker
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.worker.command }}
          securityContext:
            {{- include "agentforge.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: agentforge-config
            - secretRef:
                name: agentforge-secrets
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["celery", "-A", "gateway.orchestrator.celery_app", "inspect", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
