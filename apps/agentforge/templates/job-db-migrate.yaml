{{- if (.Values.migrations | default dict).enabled }}
# Re-applies files/init.sql after every sync. The script is idempotent
# (CREATE ... IF NOT EXISTS, ON CONFLICT DO NOTHING). Postgres only runs
# /docker-entrypoint-initdb.d on an EMPTY data dir, so without this job a schema
# change would never reach an existing cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentforge-db-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "agentforge.labels" . | nindent 8 }}
        app.kubernetes.io/name: agentforge-db-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrate
          image: {{ .Values.postgres.image }}
          securityContext:
            {{- include "agentforge.containerSecurityContext" . | nindent 12 }}
          env:
            - name: PGHOST
              value: agentforge-postgres
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentforge-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              psql -v ON_ERROR_STOP=1 -f /sql/init.sql
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: agentforge-postgres-init
{{- end }}
