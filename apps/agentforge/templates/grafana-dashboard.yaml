{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentforge-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
    grafana_dashboard: "1"    # triggers grafana-sc-dashboard sidecar pickup
data:
  agentforge-dashboard.json: |
    {
      "title": "AgentForge",
      "uid": "agentforge-main",
      "schemaVersion": 38,
      "tags": ["agentforge"],
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "rate(http_requests_total{namespace=\"agentforge\"}[5m])",
            "legendFormat": "{{`{{method}} {{path}}`}}"
          }]
        },
        {
          "id": 2,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 0},
          "targets": [{
            "expr": "rate(http_requests_total{namespace=\"agentforge\",status=~\"5..\"}[5m]) / rate(http_requests_total{namespace=\"agentforge\"}[5m]) * 100",
            "legendFormat": "Error %"
          }]
        },
        {
          "id": 3,
          "title": "Request Latency p99 (s)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 6},
          "targets": [{
            "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{namespace=\"agentforge\"}[5m]))",
            "legendFormat": "p99"
          }]
        },
        {
          "id": 4,
          "title": "Memory Usage (MB)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 6},
          "targets": [{
            "expr": "container_memory_working_set_bytes{namespace=\"agentforge\"} / 1024 / 1024",
            "legendFormat": "{{`{{container}}`}}"
          }]
        }
      ],
      "time": {"from": "now-1h", "to": "now"},
      "refresh": "30s"
    }
{{- end }}
