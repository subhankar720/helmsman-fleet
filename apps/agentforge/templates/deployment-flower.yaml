{{- if .Values.flower.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforge-flower
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforge-flower
  template:
    metadata:
      labels:
        {{- include "agentforge.labels" . | nindent 8 }}
        app.kubernetes.io/name: agentforge-flower
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: flower
          image: {{ .Values.flower.image }}
          securityContext:
            {{- include "agentforge.containerSecurityContext" . | nindent 12 }}
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: agentforge-secrets
                  key: REDIS_URL
          ports:
            - name: http
              containerPort: 5555
          resources:
            {{- toYaml .Values.flower.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 10
            periodSeconds: 20
{{- end }}
