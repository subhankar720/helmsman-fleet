{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentforge-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentforge.labels" . | nindent 4 }}
  annotations:
    # Own wave before postgres/redis (wave 0), which need this Secret. On a fresh pair the first
    # sync can run before the ESO webhook is up or before dev-up has filled Vault; in its own
    # wave a failure here ends the sync and the Application's retry policy re-runs it. In wave 0
    # Argo instead waited forever for postgres to become healthy (WO-1.5b rebuild attempt 3).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: agentforge-secrets
    creationPolicy: Owner
  data:
    # LLM
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: agentforge/llm       # NOTE: no secret/ prefix — ESO adds it
        property: groq_api_key

    # Database
    - secretKey: DATABASE_URL
      remoteRef:
        key: agentforge/db
        property: database_url
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: agentforge/db
        property: postgres_password

    # Cache
    - secretKey: REDIS_URL
      remoteRef:
        key: agentforge/cache
        property: redis_url

    # Confluence
    - secretKey: CONFLUENCE_URL
      remoteRef:
        key: agentforge/confluence
        property: confluence_url
    - secretKey: CONFLUENCE_EMAIL
      remoteRef:
        key: agentforge/confluence
        property: confluence_email
    - secretKey: CONFLUENCE_API_TOKEN
      remoteRef:
        key: agentforge/confluence
        property: confluence_api_token

    # Auth
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: agentforge/auth
        property: keycloak_client_secret
{{- end }}
