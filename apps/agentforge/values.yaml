# ── AgentForge Helm Chart Values ─────────────────────────────────────────────
# These are the defaults. Override in values-helmsman-onprem.yaml

image:
  repository: ghcr.io/subhankar720/agentforge
  tag: "ff226856c372bec922a5491c97cfa60f644d01f3"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

serviceAccount:
  name: agentforge

# ── Gateway (FastAPI) ─────────────────────────────────────────────────────────
gateway:
  replicas: 1
  command:
    - uvicorn
    - gateway.api.main:app
    - --host=0.0.0.0
    - --port=8000
    - --workers=1
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10

# ── Celery Worker ─────────────────────────────────────────────────────────────
worker:
  replicas: 1
  command:
    - celery
    - --app=gateway.orchestrator.celery_app   # short -A=... passes "=gateway..." as the module name
    - worker
    - --queues=sdlc,default
    - --concurrency=2
    - --loglevel=info
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  image: redis:7-alpine
  storage: 1Gi
  storageClass: standard
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# ── Postgres ──────────────────────────────────────────────────────────────────
postgres:
  image: pgvector/pgvector:pg16
  storage: 5Gi
  storageClass: standard
  database: agentforge
  user: agentforge
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ── Flower (Celery UI) ────────────────────────────────────────────────────────
flower:
  enabled: true
  image: mher/flower:2.0
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

# ── Networking ────────────────────────────────────────────────────────────────
httproute:
  enabled: true
  host: agentforge.helmsman.local
  gateway:
    name: helmsman-gateway
    namespace: gateway-infra
  # Authenticated traffic routes through the Helmsman-managed oauth2-proxy in
  # gateway-infra (a ReferenceGrant there permits the cross-namespace backend).
  # oauth2-proxy sets X-Forwarded-User / -Email / -Preferred-Username / -Groups
  # (client-sent copies are overwritten). Never read X-Auth-Request-*: clients
  # can forge them. Team = the one X-Forwarded-Groups entry starting "/teams/"
  # (order isn't stable; see docs/agentforge-identity-integration.md).
  #
  # Envoy Gateway's default route timeout is 15 s, which cuts off synchronous
  # agent/pipeline runs and SSE streams. Applies to the authenticated rule.
  timeouts:
    request: 360s
  oauth2Proxy:
    name: agentforge-oauth2-proxy
    namespace: gateway-infra
    port: 4180

# ── Auth ──────────────────────────────────────────────────────────────────────
auth:
  enabled: false          # true in values-helmsman-onprem.yaml

# ── Non-secret config ─────────────────────────────────────────────────────────
config:
  modelBackend: cloud_free
  env: staging
  logLevel: INFO
  authEnabled: "false"
  hitlAutoApprove: "false"
  ollamaBaseUrl: http://host.docker.internal:11434/v1
  confluenceSpaceKey: "~712020e0e86f151c104276b5ec2e685ae3b22e"
  confluenceAncestorId: "589825"
  groqModel: openai/gpt-oss-120b      # Groq production tier; change here if Groq retires it again
  llmHealthCacheSeconds: 300          # /health/ready LLM probe cache (failures cached <=30s)

# ── External Secrets ──────────────────────────────────────────────────────────
externalSecrets:
  enabled: true
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  refreshInterval: 1h

# ── Observability ─────────────────────────────────────────────────────────────
serviceMonitor:
  enabled: true
  labels:
    release: platform-prometheus-stack
  interval: 30s

grafanaDashboard:
  enabled: true

# ── Jobs ──────────────────────────────────────────────────────────────────────
migrations:
  enabled: true                        # PostSync job that applies files/init.sql

ingest:
  enabled: true
  schedule: "0 2 * * *"
  suspend: true                        # run on demand; set false for nightly re-index

# ── Network Policies ──────────────────────────────────────────────────────────
networkPolicies:
  enabled: true
