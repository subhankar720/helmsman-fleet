apiVersion: v1
kind: ConfigMap
metadata:
  name: helmsman-realm
  namespace: keycloak
  annotations:
    # platform-admin is a synthetic test identity. It has no password in git
    # (WO-1.5a): set one from ~/.helmsman-dev/keycloak-platform-admin-password
    # with the Keycloak admin API when needed (docs/credentials.md). Keycloak
    # has no PVC, so after a restart the re-imported user has no password.
    helmsman.dev/secret-classification: dev-only
data:
  helmsman-realm.json: |
    {
      "realm": "helmsman",
      "enabled": true,
      "displayName": "Helmsman Platform",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "bruteForceProtected": true,
      "users": [
        {
          "username": "platform-admin",
          "enabled": true,
          "email": "platform-admin@helmsman.dev",
          "realmRoles": ["default-roles-helmsman"]
        }
      ]
    }
