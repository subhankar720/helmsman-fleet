apiVersion: v1
kind: ConfigMap
metadata:
  name: helmsman-realm
  namespace: keycloak
  annotations:
    # The realm import holds no users (WO-1.5b: the test identity platform-admin was
    # removed; nothing referenced it). dev-up Stage 10.5 creates the AgentForge users.
    helmsman.dev/secret-classification: dev-only
data:
  helmsman-realm.json: |
    {
      "realm": "helmsman",
      "enabled": true,
      "displayName": "Helmsman Platform",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "bruteForceProtected": true
    }
