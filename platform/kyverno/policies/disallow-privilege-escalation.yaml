apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/description: >
      Containers must set allowPrivilegeEscalation: false.
      This prevents a container process from gaining more privileges
      than its parent process — even if the image contains setuid binaries.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-privilege-escalation
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaceSelector:
                matchLabels:
                  helmsman.dev/managed: "true"
      validate:
        message: "Containers must set securityContext.allowPrivilegeEscalation: false"
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
