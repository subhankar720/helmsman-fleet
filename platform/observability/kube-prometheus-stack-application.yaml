apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "65.8.1"
    helm:
      values: |
        # Minimal footprint for local dev
        grafana:
          enabled: true
          adminPassword: helmsman123
          service:
            type: NodePort
            nodePort: 30030
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Pre-configure Loki as a datasource
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://platform-loki.monitoring.svc.cluster.local:3100
              access: proxy
        prometheus:
          prometheusSpec:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            # Scrape all namespaces
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            retention: 24h
            storageSpec: {}
        # Disable heavy components not needed for local dev
        alertmanager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
