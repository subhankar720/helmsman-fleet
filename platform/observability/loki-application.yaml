apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "6.21.0"
    helm:
      values: |
        # Single-binary mode — simplest for local dev
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          persistence:
            enabled: false
          # persistence.enabled=false does NOT give Loki a writable /var/loki —
          # the chart only mounts a volume there via a PVC (persistence.enabled=true)
          # or these extraVolumes. Without one, /var/loki hits the container's
          # read-only root filesystem and Loki crashes on startup (ruler-storage
          # module: "mkdir /var/loki: read-only file system").
          extraVolumes:
            - name: storage
              emptyDir: {}
          extraVolumeMounts:
            - name: storage
              mountPath: /var/loki
        # Disable components not needed in SingleBinary mode
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        resultsCache:
          enabled: false
        chunksCache:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
