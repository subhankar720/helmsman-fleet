apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-envoy-gateway-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/subhankar720/helmsman-fleet.git
    targetRevision: main
    path: platform/envoy-gateway
    directory:
      exclude: "{argocd-application.yaml,spoke-application.yaml}"
  destination:
    name: helmsman-onprem
    namespace: gateway-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # GatewayClass/Gateway CRDs come from platform-envoy-gateway;
    # retry until that chart has installed them on the spoke.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
