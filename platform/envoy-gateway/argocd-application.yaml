apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-envoy-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gateway.envoyproxy.io/helm-chart
    chart: gateway-helm
    targetRevision: "v1.3.1"
    helm:
      values: |
        deployment:
          envoyGateway:
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
