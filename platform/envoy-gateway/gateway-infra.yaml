---
# GatewayClass tells Kubernetes which controller manages Gateways
# with this class. Deployed cluster-scoped on spoke.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
  labels:
    app.kubernetes.io/managed-by: helmsman
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: helmsman-proxy
    namespace: gateway-infra
---
# kind has no LoadBalancer controller, so expose the Envoy proxy
# as a NodePort; otherwise the Gateway never gets an address.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: helmsman-proxy
  namespace: gateway-infra
  labels:
    app.kubernetes.io/managed-by: helmsman
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
---
# Shared Gateway — all platform apps attach HTTPRoutes to this.
# Lives in gateway-infra namespace, not in app namespaces.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: helmsman-gateway
  namespace: gateway-infra
  labels:
    app.kubernetes.io/managed-by: helmsman
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All    # allow HTTPRoutes from any namespace
