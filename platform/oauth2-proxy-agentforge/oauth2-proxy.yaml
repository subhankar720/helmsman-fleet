---
# ExternalSecret — syncs oauth2-proxy credentials from Vault
# cookie_secret and keycloak client credentials live in Vault agentforge/auth
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentforge-oauth2-proxy-secret
  namespace: gateway-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agentforge-oauth2-proxy-secret
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: agentforge/auth
        property: keycloak_client_secret
    - secretKey: cookie-secret
      remoteRef:
        key: agentforge/auth
        property: cookie_secret
---
# oauth2-proxy Deployment
# Validates Keycloak JWTs, injects X-Auth-Request-* headers,
# proxies authenticated requests to the AgentForge gateway service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforge-oauth2-proxy
  namespace: gateway-infra
  labels:
    app.kubernetes.io/name: agentforge-oauth2-proxy
    app.kubernetes.io/managed-by: helmsman
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforge-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentforge-oauth2-proxy
        app.kubernetes.io/managed-by: helmsman
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            # OIDC provider — Keycloak helmsman realm
            - --provider=oidc
            - --oidc-issuer-url=$(KEYCLOAK_URL)/realms/helmsman   # keycloak-url already includes http://
            - --client-id=agentforge-gateway
            # Upstream — AgentForge gateway service in agentforge namespace
            # Cross-namespace: use FQDN
            - --upstream=http://agentforge-gateway.agentforge.svc.cluster.local:8000
            - --http-address=0.0.0.0:4180
            # Auth settings
            - --email-domain=*
            - --scope=openid profile email
            # Header injection — AgentForge reads these
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --pass-user-headers=true
            # Skip auth for health and metrics endpoints
            - --skip-auth-route=^/health
            - --skip-auth-route=^/metrics
            # Cookie settings
            - --cookie-secure=false   # HTTP only for local dev — set true in prod
            - --cookie-name=_helmsman_auth
          env:
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: helmsman-platform-config
                  key: keycloak-url
                  optional: false
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentforge-oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentforge-oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Service — Envoy Gateway routes to this
apiVersion: v1
kind: Service
metadata:
  name: agentforge-oauth2-proxy
  namespace: gateway-infra
  labels:
    app.kubernetes.io/name: agentforge-oauth2-proxy
    app.kubernetes.io/managed-by: helmsman
spec:
  selector:
    app.kubernetes.io/name: agentforge-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
---
# HTTPRoute — routes agentforge.helmsman.local through oauth2-proxy
# AgentForge team attaches their own HTTPRoute once their service is deployed
# This route is the platform-level entry point owned by Helmsman
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentforge-gateway-route
  namespace: gateway-infra
  labels:
    app.kubernetes.io/managed-by: helmsman
spec:
  parentRefs:
    - name: helmsman-gateway
      namespace: gateway-infra
  hostnames:
    - agentforge.helmsman.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agentforge-oauth2-proxy
          namespace: gateway-infra
          port: 4180
