---
# ExternalSecret — syncs oauth2-proxy credentials from Vault (agentforge/auth)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentforge-oauth2-proxy-secret
  namespace: gateway-infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agentforge-oauth2-proxy-secret
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: agentforge/auth
        property: keycloak_client_secret
    - secretKey: cookie-secret
      remoteRef:
        key: agentforge/auth
        property: cookie_secret
---
# oauth2-proxy Deployment — validates Keycloak JWTs, injects X-Auth-Request-*
# headers, proxies authenticated requests to the AgentForge gateway service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforge-oauth2-proxy
  namespace: gateway-infra
  labels:
    app.kubernetes.io/name: agentforge-oauth2-proxy
    app.kubernetes.io/managed-by: helmsman
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforge-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentforge-oauth2-proxy
        app.kubernetes.io/managed-by: helmsman
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=$(KEYCLOAK_URL)/realms/helmsman   # keycloak-url already includes http:// (dev-up Stage 6)
            - --client-id=agentforge-gateway
            - --upstream=http://agentforge-gateway.agentforge.svc.cluster.local:8000
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --scope=openid profile email
            # Identity reaches AgentForge as X-Forwarded-{User,Email,Groups,Preferred-Username}
            # (--pass-user-headers; client-sent copies are overwritten/stripped).
            # --set-xauthrequest only sets X-Auth-Request-* on *responses* (nginx
            # auth_request mode) — upstream never gets them from oauth2-proxy, and
            # client-sent X-Auth-Request-* pass through untouched, so never trust them.
            - --set-xauthrequest=true
            # Off: nothing in AgentForge reads X-Forwarded-Access-Token. Turn back on
            # only if the app starts verifying the JWT itself.
            - --pass-access-token=false
            - --pass-user-headers=true
            # Accept Keycloak access tokens as "Authorization: Bearer" (CLI/SDK via
            # the agentforge-cli client). Validated against the OIDC issuer; the
            # token's aud must include agentforge-gateway (audience mapper).
            - --skip-jwt-bearer-tokens=true
            # API clients get 401 instead of a 302 to the Keycloak login page
            # when the token is missing, expired or invalid. Browser paths
            # outside /v1/ still redirect.
            - --api-route=^/v1/
            # Default 30 s: a synchronous agent/pipeline run longer than that got
            # 502. Matches the HTTPRoute request timeout (apps/agentforge,
            # httproute.timeouts.request: 360s). Streams (SSE) aren't affected
            # once headers are sent; the route timeout caps their total length.
            - --upstream-timeout=6m
            - --skip-auth-route=^/health$
            - --skip-auth-route=^/metrics$
            - --skip-provider-button=true
            - --cookie-secure=false   # HTTP only for local dev — true in prod
            - --cookie-name=_helmsman_auth
          env:
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: helmsman-platform-config
                  key: keycloak-url
                  optional: false
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentforge-oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentforge-oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agentforge-oauth2-proxy
  namespace: gateway-infra
  labels:
    app.kubernetes.io/name: agentforge-oauth2-proxy
    app.kubernetes.io/managed-by: helmsman
spec:
  selector:
    app.kubernetes.io/name: agentforge-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
---
# ReferenceGrant — lets AgentForge's HTTPRoute (agentforge namespace) use
# agentforge-oauth2-proxy (gateway-infra) as a cross-namespace backend.
# NOTE: the old Helmsman-owned HTTPRoute "agentforge-gateway-route" was removed;
# AgentForge's chart now owns the route for agentforge.helmsman.local.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: agentforge-to-oauth2-proxy
  namespace: gateway-infra
  labels:
    app.kubernetes.io/managed-by: helmsman
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: agentforge
  to:
    - group: ""
      kind: Service
      name: agentforge-oauth2-proxy
