# Wave 2 — the "app". Each pod records, at start, the schema version it found in the database, and
# serves its own expected version on :8080. The schemaVersion annotation makes every new version roll.
apiVersion: v1
kind: Service
metadata:
  name: wo-p1b-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector: {app: wo-p1b-app}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wo-p1b-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector: {matchLabels: {app: wo-p1b-app}}
  template:
    metadata:
      labels: {app: wo-p1b-app}
      annotations:
        wo-p1b/schema-version: {{ .Values.schemaVersion | quote }}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: {{ .Values.image }}
          env:
            - {name: EXPECTED_SCHEMA, value: {{ .Values.schemaVersion | quote }}}
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json, os, time, urllib.request
              from http.server import BaseHTTPRequestHandler, HTTPServer
              ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              seen = json.loads(urllib.request.urlopen("http://wo-p1b-db:8080/schema", timeout=5).read())
              print("app: started", ts, "expected schema", os.environ["EXPECTED_SCHEMA"], "| db had", seen)
              body = json.dumps({"app_schema": os.environ["EXPECTED_SCHEMA"], "db_at_start": seen, "pod": os.environ.get("HOSTNAME")}).encode()
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
                  def log_message(self, *a): pass
              HTTPServer(("0.0.0.0", 8080), H).serve_forever()
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
