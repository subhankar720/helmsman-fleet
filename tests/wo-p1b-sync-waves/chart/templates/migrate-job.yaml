# Wave 1 — the migration, as a Sync-phase hook (not PostSync): it runs after wave 0 is Healthy and
# before wave 2 is applied. BeforeHookCreation deletes the previous Job first, because Jobs are
# immutable and must be recreated on every sync. backoffLimit 0 keeps the failure case fast.
apiVersion: batch/v1
kind: Job
metadata:
  name: wo-p1b-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels: {app: wo-p1b-migrate}
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.image }}
          command: ["python3", "-u", "-c"]
          args:
            - |
              import json, sys, time, urllib.request
              ts = lambda: time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              db = "http://wo-p1b-db:8080/schema"
              print("migrate: start", ts(), "target schema {{ .Values.schemaVersion }}")
              print("migrate: db currently", urllib.request.urlopen(db, timeout=5).read().decode())
              if {{ if .Values.migration.fail }}True{{ else }}False{{ end }}:
                  print("migrate: FAILING ON PURPOSE (migration.fail=true)", ts()); sys.exit(1)
              r = urllib.request.urlopen(urllib.request.Request(db + "?v={{ .Values.schemaVersion }}", method="PUT"), timeout=5)
              print("migrate: done", ts(), r.read().decode())
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
