{{- if .Values.oidc.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.appName }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "golden-path-chart.labels" . | nindent 4 }}
  annotations:
    # Own wave before the workload that mounts this Secret: on a fresh pair a failure here ends
    # the sync (and it is retried) instead of Argo waiting forever for the workload (WO-1.5b).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.appName }}-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: apps/{{ .Values.appName }}/oidc
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: apps/{{ .Values.appName }}/oidc
        property: client-secret
    - secretKey: issuer-url
      remoteRef:
        key: apps/{{ .Values.appName }}/oidc
        property: issuer-url
    - secretKey: cookie-secret
      remoteRef:
        key: apps/{{ .Values.appName }}/oidc
        property: cookie-secret
{{- end }}
