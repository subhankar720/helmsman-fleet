apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-fluent-bit-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "golden-path-chart.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             5
        Daemon            Off
        Log_Level         info
        Parsers_File      parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/app/app.log
        Tag               app.{{ .Values.appName }}
        Parser            json
        Refresh_Interval  5
        Skip_Empty_Lines  On

    {{- if and .Values.loki .Values.loki.url }}
    # Ship to Loki when endpoint is configured
    [OUTPUT]
        Name              loki
        Match             *
        Host              {{ .Values.loki.url | trimPrefix "http://" | splitList ":" | first }}
        Port              {{ .Values.loki.url | splitList ":" | last }}
        Labels            job=fluent-bit,app={{ .Values.appName }},namespace={{ .Release.Namespace }}
        Label_Keys        $method,$path,$status
        Auto_Kubernetes_Labels off
        line_format       json
    {{- else }}
    # Fall back to stdout when Loki is not configured
    [OUTPUT]
        Name              stdout
        Match             *
        Format            json_lines
    {{- end }}

  parsers.conf: |
    [PARSER]
        Name          json
        Format        json
        Time_Key      timestamp
        Time_Format   %Y-%m-%dT%H:%M:%SZ
