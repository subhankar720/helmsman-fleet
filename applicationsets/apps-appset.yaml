apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helmsman-apps
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          # Generator 1: finds every directory under apps/ in the fleet repo.
          # Each directory = one application. Adding a new app = adding a folder.
          - git:
              repoURL: https://github.com/subhankar720/helmsman-fleet.git
              revision: main
              directories:
                - path: "apps/*"
                # agentforge ships its own Helm chart and Argo CD Application
                # (apps/agentforge/argocd-application.yaml), not golden-path values
                - path: "apps/agentforge"
                  exclude: true
          # Generator 2: finds every Argo CD registered cluster
          # that has the label platform-enabled=true.
          # Adding a new cluster = labelling it and Argo CD fans out automatically.
          - clusters:
              selector:
                matchLabels:
                  platform-enabled: "true"
  template:
    metadata:
      # Name: <app-directory-name>-<cluster-name>
      # e.g. sample-app-helmsman-onprem
      name: '{{path.basename}}-{{name}}'
      annotations:
        # As for agentforge: diff from a server-side dry run. Kyverno pins each signed image to
        # its digest at admission (tag -> tag@sha256:...); a client-side diff reports that as
        # permanent drift, so a freshly built pair never shows Synced (WO-1.5b rebuild test).
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: default
      # Multi-source: chart comes from golden-path-chart/,
      # values come from apps/<appname>/values-<clustername>.yaml
      # The $values ref gives the chart access to files outside its own directory.
      sources:
        - repoURL: https://github.com/subhankar720/helmsman-fleet.git
          targetRevision: main
          path: golden-path-chart
          helm:
            valueFiles:
              - $values/apps/{{path.basename}}/values-{{name}}.yaml
        - repoURL: https://github.com/subhankar720/helmsman-fleet.git
          targetRevision: main
          ref: values
      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true      # delete resources removed from git
          selfHeal: true   # revert manual cluster edits
        syncOptions:
          - CreateNamespace=true
          # Server-side apply, as for agentforge; goes with ServerSideDiff above (WO-1.5b).
          # dev-up therefore syncs this app without --force (Argo rejects force with SSA).
          - ServerSideApply=true
        # A first sync on a fresh pair can fail on the ExternalSecret (wave -1); retry it (WO-1.5b).
        retry:
          limit: 15
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 3m
